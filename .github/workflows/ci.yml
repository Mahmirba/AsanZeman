# D8: GitHub Actions while the code lives on GitHub; stages mirror 8-2 so they port to GitLab CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

defaults:
  run:
    working-directory: backend

jobs:
  build-and-unit-test:
    name: Build + unit tests + coverage gate (D50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build, unit tests, Modulith/ArchUnit, JaCoCo check
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  integration-test:
    name: Integration tests (Testcontainers Oracle)
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Failsafe *IT against Oracle Free
        run: ./mvnw -B -ntp verify -Dintegration=true -Djacoco.skip=true -DskipTests=false -Dsurefire.skip=true

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - run: ./mvnw -B -ntp -DskipTests org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

  image:
    name: Docker image + Trivy scan
    runs-on: ubuntu-latest
    needs: [integration-test, dependency-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t asanzeman-core:${{ github.sha }} .
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: asanzeman-core:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend/trivy.sarif
