# Local Oracle Database Free. The app runs on the host.
# Needs deploy/.env with ORACLE_PWD (copy .env.example).
services:
  oracle-free:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD:?set ORACLE_PWD in deploy/.env}
    volumes:
      - oracle-free-data:/opt/oracle/oradata
      # *.sql here run once, on the first start with an empty volume
      - ./oracle/setup:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1m

volumes:
  oracle-free-data:
