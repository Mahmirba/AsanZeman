# Local environment (Phase 0 exit criterion): Oracle Free + WireMock stubs for the bank services + the core.
# First start of Oracle takes a few minutes; the app waits for its health check.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: azs_app
      APP_USER_PASSWORD: azs
    ports:
      - "1521:1521"
    volumes:
      - ./oracle/01_schemas.sql:/container-entrypoint-initdb.d/01_schemas.sql:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  # One WireMock serves every bank service; stubs live in deploy/wiremock/mappings (7-1).
  wiremock:
    image: wiremock/wiremock:3.13.0
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro

  core:
    build:
      context: ../backend
    depends_on:
      oracle:
        condition: service_healthy
      wiremock:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      # the only configuration file (D36); copy application.local.example.properties and fill it in
      - ./application.local.properties:/config/application.properties:ro
    environment:
      JAVA_OPTS: "-Xmx768m"

volumes:
  oracle-data:
