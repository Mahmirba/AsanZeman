# Local Oracle Database 19c Enterprise Edition. The app runs on the host.
# Needs: docker login container-registry.oracle.com (terms accepted for "Database Enterprise")
# and deploy/.env with ORACLE_PWD (copy .env.example).
services:
  oracle19c:
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    container_name: oracle19c
    ports:
      - "1521:1521"
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_CHARACTERSET: AL32UTF8
      ORACLE_PWD: ${ORACLE_PWD:?set ORACLE_PWD in deploy/.env}
    volumes:
      - oracle19c-data:/opt/oracle/oradata
      # *.sql here run once, after the database is created (first start only)
      - ./oracle/setup:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 5m

volumes:
  oracle19c-data:
