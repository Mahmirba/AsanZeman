# Copy to deploy/application.local.properties (git-ignored) for `docker compose up`.
# Points every bank service at the WireMock container. Only the keys that differ from the defaults.
spring.datasource.url=jdbc:oracle:thin:@//oracle:1521/FREEPDB1
spring.datasource.username=azs_app
spring.datasource.password=azs
azs.security.jwt.private-key-pem=dev-only
azs.security.jwt.public-key-pem=dev-only
azs.integration.gateway.token-url=http://wiremock:8080/gateway/connect/token
azs.integration.gateway.client-id=local
azs.integration.gateway.client-secret=local
azs.integration.yaghut.base-url=http://wiremock:8080/yaghut
azs.integration.yaghut.technical-user.username=local
azs.integration.yaghut.technical-user.password=local
azs.integration.aaa.url=http://wiremock:8080/aaa/AuthorizationSrv.svc
azs.integration.aaa.application-name=local
azs.integration.aaa.store-name=local
azs.integration.aaa.username=local
azs.integration.aaa.password=local
azs.integration.personnel-info.url=http://wiremock:8080/personnel-info
azs.integration.notifier.base-url=http://wiremock:8080/notifier
azs.integration.notifier.user=local
azs.integration.notifier.pass=local
azs.integration.arcaptcha.verify-url=http://wiremock:8080/arcaptcha/verify
azs.integration.arcaptcha.verify-enabled=false
azs.integration.arcaptcha.bank.site-key=local
azs.integration.arcaptcha.bank.secret-key=local
azs.integration.arcaptcha.agency.site-key=local
azs.integration.arcaptcha.agency.secret-key=local
azs.integration.arcaptcha.customer.site-key=local
azs.integration.arcaptcha.customer.secret-key=local
azs.integration.inquiry.base-url=http://wiremock:8080/inquiry
