# One server's own configuration (D13, D36): copy to /etc/asanzeman/application.properties, owner asanzeman, mode 600.
# It holds ONLY what differs from the application.properties inside the jar, which carries every other default. A secret
# left as CHANGE_ME makes the application refuse to start and name the keys, so nothing here can be forgotten silently.

# --- the database (the runtime account, see db/dba/03_runtime_grants.sql) -------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@//CHANGE_ME_HOST:1521/CHANGE_ME_SERVICE
spring.datasource.username=AZS_APP
# migrations are applied by the DBA with the migration account, never by the running application (docs/runbook.md)
spring.flyway.enabled=false

# --- the reverse proxy (docs/ops-settings.md) ----------------------------------------------------------------------------
# a regex of the proxy addresses, so X-Forwarded-For is trusted only from them; the default matches none
server.tomcat.remoteip.internal-proxies=CHANGE_ME
# the monitoring port: not published to the panels' network
management.server.port=8081

# --- secrets: every value must be set, and the same on every VM for the JWT keys --------------------------------------
spring.datasource.password=CHANGE_ME
azs.security.jwt.private-key-pem=CHANGE_ME
azs.security.jwt.public-key-pem=CHANGE_ME
azs.integration.gateway.client-id=CHANGE_ME
azs.integration.gateway.client-secret=CHANGE_ME
azs.integration.yaghut.base-url=CHANGE_ME
azs.integration.yaghut.technical-user.username=CHANGE_ME
azs.integration.yaghut.technical-user.password=CHANGE_ME
azs.integration.aaa.application-name=CHANGE_ME
azs.integration.aaa.store-name=CHANGE_ME
azs.integration.aaa.username=CHANGE_ME
azs.integration.aaa.password=CHANGE_ME
azs.integration.notifier.user=CHANGE_ME
azs.integration.notifier.pass=CHANGE_ME
azs.integration.arcaptcha.bank.site-key=CHANGE_ME
azs.integration.arcaptcha.bank.secret-key=CHANGE_ME
azs.integration.arcaptcha.agency.site-key=CHANGE_ME
azs.integration.arcaptcha.agency.secret-key=CHANGE_ME
azs.integration.arcaptcha.customer.site-key=CHANGE_ME
azs.integration.arcaptcha.customer.secret-key=CHANGE_ME
azs.integration.inquiry.sabt-ahval.fields.user-name=CHANGE_ME
azs.integration.inquiry.sabt-ahval.fields.ip=CHANGE_ME
azs.integration.inquiry.shahkar.fields.user-name=CHANGE_ME
azs.integration.inquiry.shahkar.fields.ip=CHANGE_ME
