# Persian texts for RFC 7807 "detail" (D48). Keys are DomainException codes. SRS texts are kept verbatim
# except the SRS typo «شماه» which is corrected to «شماره» (D29).
internal.error=خطای داخلی رخ داده است. لطفاً بعداً تلاش کنید.
service.temporarily-unavailable=در حال حاضر امکان ارتباط با سرویس {0} وجود ندارد. لطفاً بعداً تلاش کنید.
access.denied=شما مجوز انجام این عملیات را ندارید.
validation.failed=اطلاعات ورودی معتبر نیست.
validation.invalid=مقدار نامعتبر است.
azs.validation.national-code=کد ملی وارد شده معتبر نیست.
http.400=درخواست نامعتبر است.
http.404=مسیر درخواستی وجود ندارد.
http.405=این عملیات برای مسیر درخواستی مجاز نیست.
http.406=قالب درخواستی پشتیبانی نمی‌شود.
http.415=نوع محتوای ارسالی پشتیبانی نمی‌شود.
http.500=خطای داخلی رخ داده است. لطفاً بعداً تلاش کنید.
http.503=سرویس در دسترس نیست. لطفاً بعداً تلاش کنید.
auth.captcha-invalid=لطفاً کپچا را دوباره حل کنید.
auth.unauthenticated=برای دسترسی به این بخش باید وارد سامانه شوید.
auth.bank.invalid-credentials=نام کاربری یا رمز عبور اشتباه است.
auth.bank.no-access=شما مجوز دسترسی به سامانه آسان ضمان را ندارید.
auth.bank.personnel-not-found=اطلاعات پرسنلی شما یافت نشد. لطفاً با راهبر سامانه تماس بگیرید.
auth.session-invalid=نشست شما منقضی شده است. لطفاً دوباره وارد شوید.
