# =====================================================================================
# Asan Zeman - the ONLY configuration file (D36). No profile files.
# The copy in git holds CHANGE_ME for every secret (D13); each server keeps its own copy
# with real values, readable only by the operations team. The application refuses to start
# while any azs.* secret is still CHANGE_ME (see SecretsGuard).
# =====================================================================================

spring.application.name=asanzeman
server.port=8080
server.shutdown=graceful

# Virtual threads for HTTP, @Async, scheduling and the inquiry stages (D24)
spring.threads.virtual.enabled=true

# --- Oracle (the only store, D41) -----------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=AZS_APP
spring.datasource.password=CHANGE_ME
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=AZS_BUSINESS
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# --- Flyway (D20): forward-fix only; schemas created by db/dba, managed here ------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.schemas=AZS_BUSINESS,AZS_AUTH,AZS_INQUIRY,AZS_AUDIT,AZS_OUTBOX
spring.flyway.default-schema=AZS_BUSINESS
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# --- Spring Web Services is used only as a client (AAA); do not expose its server servlet at /services/* -----
spring.autoconfigure.exclude=org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration

# --- Modulith -------------------------------------------------------------------------
spring.modulith.events.jdbc.schema-initialization.enabled=false

# --- Web / JSON -----------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Tehran
spring.web.locale=fa_IR
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Actuator / observability (8-4) ---------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.observations.annotations.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
logging.structured.format.console=ecs
logging.level.com.sb24.asanzeman=INFO

# --- Security / tokens (D5, D7): RS256 keys in PEM, no cookies -------------------------
azs.security.jwt.issuer=asanzeman
azs.security.jwt.private-key-pem=CHANGE_ME
azs.security.jwt.public-key-pem=CHANGE_ME
azs.security.jwt.access-token-ttl=15m
azs.security.jwt.refresh-token-ttl=8h
azs.security.jwt.customer-session-ttl=30m

# --- Bank login (6.2, D33): removed from the typed login to get the accountName -----------
azs.auth.bank.account-suffix=@sb24.ir

# --- OTP (D34) ------------------------------------------------------------------------
azs.otp.validity=120s
azs.otp.max-wrong-attempts=3
azs.otp.lockout=15m

# --- Request rules --------------------------------------------------------------------
azs.request.duplicate-window=10s
azs.request.auto-reject-after=7d
azs.request.companion-max=5
azs.lock.review-idle-timeout=60m
azs.collateral.cash-min-percent=20
azs.collateral.share-step-percent=10
azs.collateral.cheap-factor=1.00
azs.collateral.expensive-factor=1.05
azs.collateral.expensive-max-balance-percent=95

# --- Inquiries (D4, D26, D27) ----------------------------------------------------------
azs.inquiry.stages=SABT_AHVAL;SHAHKAR,SEPAD,BLACKLIST,SAMA_CHEQUE,SAMAT,BOARD_RELATION,IMPORT_COMMITMENT,EXPORT_COMMITMENT
azs.inquiry.stage-deadlines=10s,15s
azs.inquiry.customer-retry-cooldown=60s
azs.inquiry.passed-result-reuse=1h
azs.inquiry.stale-run-after=60s
azs.inquiry.sepad.min-age=18
azs.inquiry.sepad.max-age=50

# --- Privacy (D22): masking exists but is OFF -----------------------------------------
azs.privacy.masking-enabled=false

# --- Reports (D42) --------------------------------------------------------------------
azs.report.csv.page-size=1000

# --- Scheduler ------------------------------------------------------------------------
azs.scheduler.branch-sync.cron=0 0 2 * * *
azs.scheduler.auto-reject.cron=0 30 1 * * *
azs.scheduler.lock-release.fixed-delay=5m
azs.scheduler.cleanup.cron=0 0 3 * * *
azs.scheduler.outbox.fixed-delay=5s

# --- Bank API Gateway token (D28) -----------------------------------------------------
azs.integration.gateway.token-url=https://apigw.int.sb2.com/ApiContainer.sso.RCL1/connect/token
azs.integration.gateway.client-id=CHANGE_ME
azs.integration.gateway.client-secret=CHANGE_ME
azs.integration.gateway.refresh-before-expiry=5m
azs.integration.gateway.connect-timeout=3s
azs.integration.gateway.read-timeout=10s
azs.integration.gateway.token-retries=2
azs.integration.gateway.retry-backoff=500ms
azs.integration.gateway.tls.skip-verify=false

# --- Yaghut (D35) ---------------------------------------------------------------------
azs.integration.yaghut.base-url=CHANGE_ME
azs.integration.yaghut.technical-user.username=CHANGE_ME
azs.integration.yaghut.technical-user.password=CHANGE_ME
azs.integration.yaghut.connect-timeout=3s
azs.integration.yaghut.read-timeout=10s
azs.integration.yaghut.tls.skip-verify=false

# --- AAA (D39) ------------------------------------------------------------------------
azs.integration.aaa.url=https://biservice:8101/SB.SecrityService.DomainVer2/AuthorizationSrv.svc
azs.integration.aaa.application-name=CHANGE_ME
azs.integration.aaa.store-name=CHANGE_ME
azs.integration.aaa.username=CHANGE_ME
azs.integration.aaa.password=CHANGE_ME
azs.integration.aaa.role-map.Branch=BRANCH
azs.integration.aaa.role-map.Admin=ADMIN
azs.integration.aaa.wss.timestamp=false
azs.integration.aaa.connect-timeout=3s
azs.integration.aaa.read-timeout=10s
azs.integration.aaa.tls.skip-verify=false

# --- personnelInfo (D33) --------------------------------------------------------------
azs.integration.personnel-info.url=https://apigw.int.sb24.com/ApiContainer.GetOverallPersonelInfo/api/GetOverallPersonelInfo/GetOverallPersonelInfo
azs.integration.personnel-info.connect-timeout=3s
azs.integration.personnel-info.read-timeout=10s
azs.integration.personnel-info.tls.skip-verify=false

# --- Notifier (D34, D40) ---------------------------------------------------------------
azs.integration.notifier.base-url=https://10.0.41.24:8012
azs.integration.notifier.user=CHANGE_ME
azs.integration.notifier.pass=CHANGE_ME
azs.integration.notifier.client-name=AZS
azs.integration.notifier.otp-args=آسان ضمان
azs.integration.notifier.read-timeout=10s
azs.integration.notifier.tls.skip-verify=false

# --- ARcaptcha (D37) ------------------------------------------------------------------
azs.integration.arcaptcha.verify-url=https://challenge.sb24.ir/api/arcaptcha/api/verify
azs.integration.arcaptcha.verify-enabled=true
azs.integration.arcaptcha.bank.site-key=CHANGE_ME
azs.integration.arcaptcha.bank.secret-key=CHANGE_ME
azs.integration.arcaptcha.agency.site-key=CHANGE_ME
azs.integration.arcaptcha.agency.secret-key=CHANGE_ME
azs.integration.arcaptcha.customer.site-key=CHANGE_ME
azs.integration.arcaptcha.customer.secret-key=CHANGE_ME
azs.integration.arcaptcha.connect-timeout=2s
azs.integration.arcaptcha.read-timeout=5s
azs.integration.arcaptcha.tls.skip-verify=false

# --- The 9 inquiries (7-4): URL, timeout, retries, fixed request fields ----------------
azs.integration.inquiry.base-url=https://apigw3p.int.sb24.com
azs.integration.inquiry.sabt-ahval.path=/SabtREST/api/Civil/GetEstelamSabt
azs.integration.inquiry.sabt-ahval.timeout=15s
azs.integration.inquiry.sabt-ahval.retries=2
azs.integration.inquiry.shahkar.path=/SBShahkar/api/ShahkarWrap/ServiceIdMatching
azs.integration.inquiry.shahkar.timeout=10s
azs.integration.inquiry.shahkar.retries=1
azs.integration.inquiry.sepad.path=/SBSepad.RCL1/api/Sepad/GetEstelam
azs.integration.inquiry.sepad.timeout=10s
azs.integration.inquiry.sepad.retries=1
azs.integration.inquiry.blacklist.path=/SBCustomerGroup/api/SBGetCstBlackList/GetCstBlackList
azs.integration.inquiry.blacklist.timeout=8s
azs.integration.inquiry.blacklist.retries=2
azs.integration.inquiry.sama-cheque.path=/SBSamaCheque/api/CbiSamaCheque/GetBouncedChequesByPersonInfo
azs.integration.inquiry.sama-cheque.timeout=12s
azs.integration.inquiry.sama-cheque.retries=2
azs.integration.inquiry.samat.path=/SBSamatWrp/api/CbiSamat/GetEstelamAsli2
azs.integration.inquiry.samat.timeout=15s
azs.integration.inquiry.samat.retries=2
azs.integration.inquiry.board-relation.path=/SBCBIBoardRelation/api/SBQueryLimit/QueryLimit
azs.integration.inquiry.board-relation.timeout=12s
azs.integration.inquiry.board-relation.retries=2
azs.integration.inquiry.import-commitment.path=/SBRafTaahodArzi.RCL1/api/RafTaahodArzi/GetTaahodArziRafNashodeh
azs.integration.inquiry.import-commitment.timeout=15s
azs.integration.inquiry.import-commitment.retries=2
azs.integration.inquiry.import-commitment.channel-code=15
azs.integration.inquiry.export-commitment.path=/SBICEPbn/api/Status
azs.integration.inquiry.export-commitment.timeout=15s
azs.integration.inquiry.export-commitment.retries=2
azs.integration.inquiry.tls.skip-verify=false

# --- Resilience4j circuit breaker defaults (7-10) -------------------------------------
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s

# --- Scheduler and branch sync (4.4, 3-3-7) ---
azs.scheduler.enabled=true
azs.branch.sync.cron=0 0 2 * * *
azs.branch.sync.page-size=100

# --- SMS outbox (6.4, D40) ---
azs.sms.dispatch-delay=5s
azs.sms.batch-size=20
azs.sms.lease=2m
azs.sms.retry-base=30s
azs.sms.retry-max=1h
azs.sms.credentials-backoff=15m
