openapi: 3.1.0
info:
  title: Asan Zeman API
  version: v1
  description: |
    Travel-return guarantee issuance (آسان ضمان). Contract-first (1-4): paths are stubs in Phase 0 and are
    filled in phase by phase. All errors are RFC 7807 Problem Details with a stable `code` extension (D48).
    Authentication: `Authorization: Bearer <JWT>`; no cookies (D7).
servers:
  - url: /api
tags:
  - { name: auth, description: Bank (AAA), agency (Yaghut) and customer (Yaghut + OTP) login }
  - { name: agency, description: Agency panel - registration, cancel/revoke, tracking, CSV }
  - { name: customer, description: Customer panel - inquiries, collateral, submit }
  - { name: branch, description: Bank panel - inbox, lock, approve, reject, issue, revocation }
  - { name: admin, description: Admin - agencies, rejection reasons, force-release }
  - { name: reports, description: Bank reports - CSV }
paths:
  /auth/bank/login:
    post:
      tags: [auth]
      summary: "Bank user login: ARcaptcha -> AAA GetRoleWindows -> personnelInfo -> tokens"
      description: |
        Public. The ARcaptcha token is verified first and the login is refused if ARcaptcha is down (fail closed).
        Errors (RFC 7807, stable `code`): 400 `auth.captcha-invalid` / `validation.failed`, 401
        `auth.bank.invalid-credentials`, 403 `auth.bank.no-access` (no mapped role) or `auth.bank.personnel-not-found`,
        503 `service.temporarily-unavailable` (AAA, personnelInfo or ARcaptcha is down).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankLoginRequest" }
      responses:
        "200":
          description: Tokens. The access token is an RS256 JWT with `sub`, `uid`, `role` (BRANCH or ADMIN), `branch_code`, `jti`, `iat`, `exp`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/agency/login:
    post:
      tags: [auth]
      summary: "Agency login: ARcaptcha -> Yaghut loginStatic -> agency by cif -> tokens"
      description: |
        Public. The session ends at the earlier of 8 hours and Yaghut's own session end; the agency's Yaghut session is
        kept on the server. Errors (RFC 7807, stable `code`): 400 `auth.captcha-invalid` / `validation.failed`, 401
        `auth.yaghut.invalid-credentials`, 403 `auth.yaghut.suspected-customer`, `auth.yaghut.access-denied`,
        `auth.yaghut.temporary-session`, `auth.yaghut.password-expired` or `auth.agency.not-registered`, 503
        `service.temporarily-unavailable`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankLoginRequest" }
      responses:
        "200":
          description: Tokens. The access token carries `role` AGENCY and no `branch_code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/customer/login:
    post:
      tags: [auth]
      summary: "Customer login, step 1: ARcaptcha -> Yaghut loginStatic -> SendOtp (6.3, D53)"
      description: |
        The SMS code goes to the mobile Yaghut holds for the customer. 400 `auth.captcha-invalid`; 401
        `auth.yaghut.invalid-credentials`; 403 `auth.yaghut.suspected-customer` (not a bank customer),
        `auth.customer.mobile-missing`, `auth.otp.locked`; 503 when Yaghut or the SMS centre is down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, arcaptchaToken]
              properties:
                username: { type: string }
                password: { type: string }
                arcaptchaToken: { type: string }
      responses:
        "200":
          description: The code was sent. Send `challengeId` and the code to `/auth/customer/otp/verify`.
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresInSeconds: { type: integer, format: int64, description: How long the code is good }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/customer/otp/verify:
    post:
      tags: [auth]
      summary: "Customer login, step 2: OtpValidate -> one 30-minute session, no refresh token (D7, D34)"
      description: |
        A code works once. 400 `auth.otp.expired` (too old, used or unknown) or `auth.otp.wrong`; 403
        `auth.otp.locked` after 3 wrong codes (15 minutes, counted per customer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string }
      responses:
        "200":
          description: The session. There is no `refreshToken`; `refreshExpiresIn` is 0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /customer/requests:
    get:
      tags: [customer]
      summary: "The requests made for the logged-in customer, newest first (Phase 2 exit)"
      description: The customer is the token's `sub`, never a parameter. CUSTOMER role only.
      responses:
        "200":
          description: The customer's requests; empty when none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequestSummary" }
  /customer/requests/{requestId}/inquiries:
    post:
      tags: [customer]
      summary: "Start the customer's inquiries in the background (5.1)"
      description: |
        Returns 202 at once with the run; poll it with the GET below. A second start while a run is in progress returns
        that run, so a double click never fails. A passed inquiry is reused for an hour. 404 for a request that is not
        the customer's; 409 `request.not-inquirable` (not waiting for its inquiries) or `inquiry.cooldown` (a blocked
        run ended too recently; the message says how many seconds are left).
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: The run, still RUNNING (or the run already in progress).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryRun" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /customer/requests/{requestId}/inquiries/{runId}:
    get:
      tags: [customer]
      summary: "Progress and result of a run"
      description: |
        `status` is RUNNING, FINISHED or STALE. Once FINISHED, `decision` is PROCEED (go on to the collateral), BLOCKED
        (some inquiry has no usable answer: try again later, nobody is rejected) or REJECT (the request is now
        REJECTED, and `message` is the SRS text). `inquiries` lists each inquiry's result once the run has finished.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryRun" }
        "404": { $ref: "#/components/responses/Problem" }
  /customer/requests/{id}:
    get:
      tags: [customer]
      summary: "One request with its companions"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The request. Another customer's request is a 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestDetails" }
        "404": { $ref: "#/components/responses/Problem" }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token (bank, agency)
      description: |
        Public. Every refresh returns a new pair and uses up the old refresh token; the session end set at login does
        not move. Presenting a used token again revokes the whole session (reuse detection). Every failure is the same
        401 `auth.session-invalid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: The access token is revoked until it would have expired, and every refresh token of its session is revoked (the session is the `sid` claim of the access token). There is no request body.
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Problem" }
  /agency/requests:
    post:
      tags: [agency]
      summary: "Register an issuance request (SRS UC-AZS-8, D47 duplicate guard, D52)"
      description: |
        AGENCY role only. The agency, its name and its Yaghut session come from the access token. Order: national
        code, branch (must be open), the customer from Yaghut with the agency's own session, then in one transaction
        the agency lock, the duplicate guard, the tracking code, the request and the customer's SMS. Dates are Jalali
        `yyyy/MM/dd`. Errors (RFC 7807, stable `code`): 400 `validation.failed`, `request.invalid-data`,
        `request.customer-not-found`, `request.customer-underage`, `request.customer-not-actual`,
        `request.customer-mobile-missing`, `request.branch-not-available`; 401 `auth.yaghut.session-expired` (log in
        again); 403 `request.agency-not-active` or `auth.yaghut.access-denied`; 409 `request.duplicate-registration`
        or `request.tracking-codes-exhausted`; 503 `service.temporarily-unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequestBody" }
      responses:
        "201":
          description: Registered. The customer is sent an SMS to complete the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      tags: [agency]
      summary: "Tracking list (SRS UC-AZS-13), newest first, only this agency's requests"
      description: |
        AGENCY role only. Every filter is optional and they combine with AND. Dates are Jalali `yyyy/MM/dd`; the
        "to" day is included whole. Errors: 400 `request.invalid-data` (bad filter, date or page), 401, 403.
      parameters:
        - { name: nationalCode, in: query, schema: { type: string } }
        - { name: customerNumber, in: query, schema: { type: string }, description: "Yaghut customer number (cif)" }
        - { name: type, in: query, schema: { type: array, items: { type: string, enum: [ISSUANCE, REVOCATION] } }, explode: true }
        - { name: trackingCode, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string }, description: "Part of the customer's full name" }
        - { name: registeredFrom, in: query, schema: { type: string } }
        - { name: registeredTo, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /agency/requests/export:
    get:
      tags: [agency]
      summary: "The same search as a CSV file (D42)"
      description: |
        Same filters as the list, without paging. UTF-8 with a byte order mark, streamed page by page. Cells a
        spreadsheet would read as a formula are prefixed with an apostrophe.
      responses:
        "200":
          description: CSV file `requests.csv`.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /agency/requests/{id}:
    get:
      tags: [agency]
      summary: "Request details with companions (SRS UC-AZS-13, alternative flow 2)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The request. Another agency's request is a 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestDetails" }
        "404": { $ref: "#/components/responses/Problem" }
  /agency/requests/{id}/cancel:
    post:
      tags: [agency]
      summary: "«ثبت درخواست ابطال»: cancel before «اقدام» (4.2, D11)"
      description: |
        Decided under the row lock. `REGISTERED_AT_AGENCY` or `PENDING_BRANCH_REVIEW` becomes `CANCELLED` and the
        customer is sent an SMS (outcome `CANCELLED`). From `UNDER_REVIEW`, `UNDER_ACTION` or `ISSUED` a new
        `REVOCATION` request is created with its own tracking code (outcome `REVOCATION_REQUESTED`; `requestId` is the
        revocation's). It joins the branch queue, or goes straight to the user holding the issuance request (D17).
        409s: `request.revocation-duplicate` (one is already open), `request.busy`, `request.not-cancellable`
        (finished, or itself a revocation). 404 for an unknown or foreign request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: What happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agency/profile:
    get:
      tags: [agency]
      summary: "The agency name for the top of every page"
      responses:
        "200":
          description: Name and 4-digit code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  code: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
  /agency/branches:
    get:
      tags: [agency]
      summary: "Open branches for the cascading list (SRS UC-AZS-8)"
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "First letters of the name or code; typing three narrows the list" }
      responses:
        "200":
          description: Open branches, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    city: { type: string }
  /agency/customers/lookup:
    post:
      tags: [agency]
      summary: "The «جستجو» step of the registration form"
      description: |
        The customer from Yaghut with the agency's own session, checked as registration checks it. Errors: 400
        `request.customer-not-found`, `request.customer-underage`, `request.customer-not-actual`,
        `request.invalid-data`; 401 `auth.yaghut.session-expired`; 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nationalCode]
              properties:
                nationalCode: { type: string }
      responses:
        "200":
          description: The customer. The birth date is Jalali `yyyy/MM/dd`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cif: { type: string }
                  nationalCode: { type: string }
                  fullName: { type: string }
                  birthDate: { type: string }
                  mobile: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /customer/requests/{requestId}/deposits:
    get:
      tags: [customer]
      summary: "The deposits the customer may offer as collateral, with their balances now (4.3)"
      description: |
        Read from Yaghut with the customer's own session and filtered again here: held alone, owner who signs, a
        natural person's, open, in rials, and of a type the bank prices. Balances are never stored (D16). Needs every
        inquiry to have passed: 409 `request.not-submittable` otherwise.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The deposits. `allowedFor` is CASH and PLEDGE for a cheap deposit, PLEDGE only for an expensive one.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [number, priceClass, availableBalance, allowedFor]
                  properties:
                    number: { type: string }
                    priceClass: { type: string, enum: [CHEAP, EXPENSIVE] }
                    availableBalance: { type: integer, format: int64, description: Whole rials }
                    allowedFor: { type: array, items: { type: string, enum: [CASH, PLEDGE] } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /customer/requests/{requestId}/collateral:
    post:
      tags: [customer]
      summary: "Choose the collateral: cash share and deposits (4.3, D14, D15, D18)"
      description: |
        Calculates from the balances as they are now and saves the result, replacing any earlier choice. The cash share is
        20 to 100 in steps of 10; the pledge is the rest. Cash comes from cheap deposits only; the pledge fills cheap
        deposits first (x1.00) then expensive ones (x1.05, at most 95 % of a balance). Everything is rounded up to the whole
        rial. 400 `request.collateral-invalid` or `request.collateral-insufficient` (the SRS text).
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cashPercent]
              properties:
                cashPercent: { type: integer, example: 20 }
                cashDeposits: { type: array, items: { type: string }, description: Deposit numbers, in the order selected }
                pledgeDeposits: { type: array, items: { type: string }, description: Deposit numbers, in the order selected }
      responses:
        "200":
          description: The calculated and saved collateral.
          content:
            application/json:
              schema:
                type: object
                required: [cash, pledgeBase, totalCollateral, allocations]
                properties:
                  cash: { type: integer, format: int64 }
                  pledgeBase: { type: integer, format: int64, description: Guarantee amount minus cash }
                  totalCollateral: { type: integer, format: int64, description: Cash plus the pledge collateral }
                  allocations:
                    type: array
                    items:
                      type: object
                      properties:
                        depositNumber: { type: string }
                        kind: { type: string, enum: [CASH, PLEDGE] }
                        priceClass: { type: string, enum: [CHEAP, EXPENSIVE] }
                        sharePercent: { type: integer }
                        factor: { type: number }
                        allocated: { type: integer, format: int64 }
                        collateral: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /customer/requests/{requestId}/submit:
    post:
      tags: [customer]
      summary: "Send the request to the branch (SRS step 15)"
      description: |
        The request becomes PENDING_BRANCH_REVIEW. 409 `request.not-submittable` when the inquiries have not passed, no
        collateral was chosen, or the request is not at the agency's step (so a second submit is refused).
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                required: [status, statusLabel]
                properties:
                  status: { type: string, enum: [PENDING_BRANCH_REVIEW] }
                  statusLabel: { type: string }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests:
    get:
      tags: [branch]
      summary: "The branch's inbox, or a search (SRS review use case, 4.4)"
      description: |
        Without `status`, the inbox: requests waiting, in review and in action. A branch user sees the requests of their own
        branch and of the branches it replaced; an admin sees every branch. A request someone holds is listed with the
        holder's name (`lockedBy`) and is read-only for everyone else. `canAct` is the branch rule for this user. Dates are
        Jalali `yyyy/MM/dd`; "to" includes the whole day. BRANCH and ADMIN roles.
      parameters:
        - { name: status, in: query, schema: { type: array, items: { $ref: "#/components/schemas/RequestStatus" } } }
        - { name: nationalCode, in: query, schema: { type: string } }
        - { name: customerNumber, in: query, schema: { type: string } }
        - { name: trackingCode, in: query, schema: { type: string } }
        - { name: registeredFrom, in: query, schema: { type: string, example: "1405/09/01" } }
        - { name: registeredTo, in: query, schema: { type: string, example: "1405/09/30" } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 200 } }
      responses:
        "200":
          description: A page of requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BranchRequest" } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
  /branch/requests/export:
    get:
      tags: [branch]
      summary: "The bank report: the same filters as the list, as a CSV file (D42)"
      description: |
        UTF-8 with a byte order mark, streamed page by page. Columns: the tracking columns, the original branch and the
        branch that handles the request now, the guarantee number, and the rejection reason and comment. A branch user
        gets their own branch's requests, an admin every branch's. A bad filter is a 400 before anything is written.
      parameters:
        - { name: status, in: query, required: false, schema: { type: array, items: { type: string } } }
        - { name: nationalCode, in: query, required: false, schema: { type: string } }
        - { name: customerNumber, in: query, required: false, schema: { type: string } }
        - { name: trackingCode, in: query, required: false, schema: { type: string } }
        - { name: registeredFrom, in: query, required: false, schema: { type: string }, description: "Jalali yyyy/MM/dd" }
        - { name: registeredTo, in: query, required: false, schema: { type: string }, description: "Jalali yyyy/MM/dd" }
      responses:
        "200":
          description: The CSV file.
          content:
            text/csv: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}:
    get:
      tags: [branch]
      summary: "One request with its companions and the collateral the customer chose"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The request. Another branch's request is a 404 for a branch user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/BranchRequest" }
                  companions:
                    type: array
                    items:
                      type: object
                      properties:
                        fullName: { type: string }
                        nationalCode: { type: string }
                        birthDate: { type: string, description: Jalali yyyy/MM/dd }
                        passportNumber: { type: string }
                  collateral:
                    type: array
                    items:
                      type: object
                      properties:
                        depositNumber: { type: string }
                        kind: { type: string, enum: [CASH, PLEDGE] }
                        priceClass: { type: string, enum: [CHEAP, EXPENSIVE] }
                        sharePercent: { type: integer }
                        factor: { type: number }
                        allocated: { type: integer, format: int64 }
                        collateral: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/Problem" }
  /branch/rejection-reasons:
    get:
      tags: [branch]
      summary: "The reasons a rejection may give (from the admin's list)"
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [ISSUANCE, REVOCATION], default: ISSUANCE } }
      responses:
        "200":
          description: Active issuance rejection reasons, in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    text: { type: string }
  /branch/requests/{id}/lock:
    post:
      tags: [branch]
      summary: "«اقدام»: take a request (4.1, D1)"
      description: |
        Atomic: two users clicking at the same moment cannot both win (one gets 409). PENDING_BRANCH_REVIEW becomes
        UNDER_REVIEW and the caller owns it. Taking a request you already hold is fine. 403 `request.branch-forbidden`
        (another branch); 409 `request.locked-by-other` (names the holder and since when), `request.busy`,
        `request.not-reviewable`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}/approve:
    post:
      tags: [branch]
      summary: "«تایید درخواست صدور»: UNDER_REVIEW becomes UNDER_ACTION; the holder keeps the request"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}/reject:
    post:
      tags: [branch]
      summary: "«رد درخواست صدور»: UNDER_REVIEW becomes REJECTED; the customer is sent an SMS"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonId, comment]
              properties:
                reasonId: { type: string, format: uuid, description: From /branch/rejection-reasons }
                comment: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}/issue:
    post:
      tags: [branch]
      summary: "Record the Farangin guarantee number: UNDER_ACTION becomes ISSUED; the customer is sent an SMS"
      description: The number is 1 to 30 letters, digits, `-`, `/` or `_` (the format is to be confirmed with the bank).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guaranteeNumber]
              properties:
                guaranteeNumber: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}/abandon:
    post:
      tags: [branch]
      summary: "«انصراف از درخواست» (in review) or «لغو اقدام» (in action, D44): back to the queue"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}/force-release:
    post:
      tags: [branch]
      summary: "ADMIN only: free a request whoever holds it (4.1); the reason is audited"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /branch/requests/{id}/complete-revocation:
    post:
      tags: [branch]
      summary: "Confirm the guarantee was revoked in Farangin: the revocation is COMPLETED, the issuance REVOKED, the customer is sent an SMS"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ReviewResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/agencies:
    get:
      tags: [admin]
      summary: "Every agency, by code"
      responses:
        "200": { description: The agencies, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminAgency" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      summary: "Add an agency (audited)"
      description: "400 for a bad value; 409 `admin.agency-duplicate` when the customer number or the 4-digit code is taken."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAgencyBody" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAgency" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/agencies/{id}:
    put:
      tags: [admin]
      summary: "Change an agency, or switch it off with active=false (audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAgencyBody" } } }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAgency" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/rejection-reasons:
    get:
      tags: [admin]
      summary: "Every rejection reason, both kinds, switched off ones too"
      responses:
        "200": { description: The reasons, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminReason" } } } } }
    post:
      tags: [admin]
      summary: "Add a rejection reason (audited)"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonBody" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReason" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /admin/rejection-reasons/{id}:
    put:
      tags: [admin]
      summary: "Change a rejection reason, or switch it off with active=false (audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonBody" } } }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReason" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/requests/{id}/force-release: { post: { tags: [admin], summary: "Admin force-release with reason (audited)", responses: { "200": { description: released } } } }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    ReviewResult:
      description: What the action left behind. `heldBy` and `heldSince` are set while someone owns the request.
      content:
        application/json:
          schema:
            type: object
            required: [requestId, status, statusLabel]
            properties:
              requestId: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/RequestStatus" }
              statusLabel: { type: string }
              heldBy: { type: string }
              heldSince: { type: string, format: date-time }
    Problem:
      description: RFC 7807 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri, example: "urn:asanzeman:error:request.locked-by-other" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Persian text from messages_fa.properties }
        instance: { type: string }
        code: { type: string, description: stable machine-readable code }
        violations: { type: object, additionalProperties: { type: string } }
    BankLoginRequest:
      type: object
      required: [username, password, arcaptchaToken]
      properties:
        username: { type: string, description: "As typed, with or without @sb24.ir" }
        password: { type: string }
        arcaptchaToken: { type: string, description: One-time ARcaptcha token (6.5) }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    RegisterRequestBody:
      type: object
      required: [nationalCode, branchCode, amount, dueDate]
      properties:
        nationalCode: { type: string, description: "The customer's national code (10 digits, checksum checked)" }
        branchCode: { type: string, description: "An open branch, as Yaghut writes the code" }
        amount: { type: integer, format: int64, minimum: 1, maximum: 9999999999999999, description: Rials }
        dueDate: { type: string, description: "تاریخ سررسید, Jalali yyyy/MM/dd" }
        companions:
          type: array
          maxItems: 5
          items:
            type: object
            required: [fullName, nationalCode, birthDate, passportNumber]
            properties:
              fullName: { type: string, maxLength: 100 }
              nationalCode: { type: string }
              birthDate: { type: string, description: "Jalali yyyy/MM/dd" }
              passportNumber: { type: string, maxLength: 30 }
    RegisteredRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        trackingCode: { type: string, description: "Branch code + agency code + Jalali YYMMDD + 4-digit counter (D12)" }
        status: { type: string, enum: [REGISTERED_AT_AGENCY] }
    RequestStatus:
      type: string
      enum: [REGISTERED_AT_AGENCY, PENDING_BRANCH_REVIEW, UNDER_REVIEW, UNDER_ACTION, ISSUED, REJECTED, CANCELLED, REVOKED, COMPLETED]
    BranchRequest:
      type: object
      description: A request as the branch sees it (4.1, 4.4).
      properties:
        request: { $ref: "#/components/schemas/RequestSummary" }
        lockedBy: { type: string, description: The user who took it with «اقدام», if any }
        lockedAt: { type: string, format: date-time }
        canAct: { type: boolean, description: The branch rule for the calling user; false means read-only }
        handlingBranch: { type: string, description: The branch that handles the request now }
        rejectionReason: { type: string }
        rejectionComment: { type: string }
        guaranteeNumber: { type: string }
    RequestSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        trackingCode: { type: string }
        type: { type: string, enum: [ISSUANCE, REVOCATION] }
        typeLabel: { type: string }
        status: { type: string, enum: [REGISTERED_AT_AGENCY, PENDING_BRANCH_REVIEW, UNDER_REVIEW, UNDER_ACTION, ISSUED, REJECTED, CANCELLED, REVOKED, COMPLETED] }
        statusLabel: { type: string }
        customerCode: { type: string }
        customerCif: { type: string }
        customerName: { type: string }
        amount: { type: integer, format: int64, description: Rials }
        branchCode: { type: string }
        branchName: { type: string }
        dueDate: { type: string, description: "Jalali yyyy/MM/dd" }
        registeredAt: { type: string, format: date-time }
        registeredAtJalali: { type: string, description: "Jalali yyyy/MM/dd HH:mm:ss, Tehran time" }
        agencyName: { type: string }
        customerMobile: { type: string }
    RequestPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RequestSummary" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    RequestDetails:
      type: object
      properties:
        request: { $ref: "#/components/schemas/RequestSummary" }
        companions:
          type: array
          items:
            type: object
            properties:
              fullName: { type: string }
              nationalCode: { type: string }
              birthDate: { type: string, description: "Jalali yyyy/MM/dd" }
              passportNumber: { type: string }
    AdminAgencyBody:
      type: object
      required: [cif, code, name]
      properties:
        cif: { type: string, maxLength: 20, description: "The Yaghut customer number the agency logs in with" }
        code: { type: string, pattern: "^[0-9]{4}$", description: "Goes into every tracking code" }
        name: { type: string, maxLength: 200 }
        active: { type: boolean, default: true }
        mobile: { type: string, pattern: "^09[0-9]{9}$", nullable: true, description: "Told about revocations by SMS; optional" }
    AdminAgency:
      type: object
      properties:
        id: { type: string, format: uuid }
        cif: { type: string }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        mobile: { type: string, nullable: true }
    AdminReasonBody:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [ISSUANCE, REVOCATION] }
        text: { type: string, maxLength: 500 }
        active: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: 0, maximum: 99999, default: 0 }
    AdminReason:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        text: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    CancelResult:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        outcome: { type: string, enum: [CANCELLED, REVOCATION_REQUESTED] }
        status: { type: string }
    InquiryRun:
      type: object
      required: [runId, status, inquiries]
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, enum: [RUNNING, FINISHED, STALE] }
        decision: { type: string, enum: [PROCEED, BLOCKED, REJECT], description: Set once the run has finished }
        message: { type: string, description: The Persian text to show for a REJECT or a BLOCKED run }
        inquiries:
          type: array
          items:
            type: object
            required: [type, result]
            properties:
              type:
                type: string
                enum: [SABT_AHVAL, SHAHKAR, SEPAD, BLACKLIST, SAMA_CHEQUE, SAMAT, BOARD_RELATION, IMPORT_COMMITMENT, EXPORT_COMMITMENT]
              result: { type: string, enum: [PASSED, NEGATIVE, FAILED, SKIPPED] }
              failure: { type: string, enum: [TIMEOUT, UNAVAILABLE, CIRCUIT_OPEN, BAD_RESPONSE, CANCELLED] }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        accessToken: { type: string, description: RS256 JWT }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, description: Seconds until the access token expires }
        refreshToken: { type: string, description: Opaque, single use, rotated on every refresh }
        refreshExpiresIn: { type: integer, format: int64, description: Seconds until the session ends }
security:
  - bearerJwt: []
